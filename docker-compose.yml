services:
  # Redis Database for Job Queues
  redis:
    image: redis:alpine
    container_name: forestvision-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

  # FastAPI Machine Learning Service
  ml-service:
    build:
      context: .
      dockerfile: ML Service/Dockerfile
    container_name: forestvision-ml-service
    ports:
      - "8000:8000"
    restart: always
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 45s

  # Node.js Express Backend
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: forestvision-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-${JWT_SECRET}}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ML_SERVICE_URL=http://ml-service:8000
      - GFW_API_KEY=${GFW_API_KEY}
      - EARTHDATA_USERNAME=${EARTHDATA_USERNAME}
      - EARTHDATA_PASSWORD=${EARTHDATA_PASSWORD}
      - BYPASS_DNS_OVERRIDE=true
      - ML_SERVICE_SPAWN=false
      - ML_SPAWN_FALLBACK=false
    depends_on:
      redis:
        condition: service_started
      ml-service:
        condition: service_healthy
    restart: always

  # React Frontend served via Nginx (Reverse Proxy)
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: forestvision-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  redis_data:
